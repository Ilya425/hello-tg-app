<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOEX Mini Terminal</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a24; /* Тёмный стильный фон */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-y: auto;
        }

        /* Заголовок приложения */
        .app-header {
            padding: 16px;
            background-color: #222230;
            border-bottom: 1px solid #2d2d3f;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: bold;
        }

        .app-header p {
            margin: 4px 0 0 0;
            font-size: 12px;
            color: #7e7e9a;
        }

        /* Контейнер списка акций */
        .stocks-list {
            padding: 8px 16px;
        }

        /* Элемент списка (строка акции) */
        .stock-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #2d2d3f;
        }

        /* Блок с логотипом и названиями */
        .stock-main-info {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 35%;
        }

        .stock-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #2d2d3f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }

        .stock-meta {
            display: flex;
            flex-direction: column;
        }

        .stock-name {
            font-size: 14px;
            font-weight: 600;
        }

        .stock-ticker {
            font-size: 11px;
            color: #7e7e9a;
            margin-top: 2px;
        }

        /* Блок микро-графика (спарклайна) */
        .stock-sparkline {
            width: 80px;
            height: 30px;
        }

        .stock-sparkline canvas {
            width: 100%;
            height: 100%;
        }

        /* Блок цены и процентов */
        .stock-financials {
            text-align: right;
            width: 30%;
        }

        .stock-price {
            font-size: 15px;
            font-weight: bold;
        }

        .stock-change {
            font-size: 12px;
            font-weight: 600;
            margin-top: 2px;
        }

        /* Цветовые стили */
        .up { color: #2ebd85; }   /* Зелёный при росте */
        .down { color: #f6465d; } /* Красный при падении */
    </style>
</head>
<body>

    <div class="app-header">
        <h1>Изменение цены</h1>
        <p>Акции MOEX • За сегодня</p>
    </div>

    <!-- Список наших акций -->
    <div class="stocks-list">
        
        <!-- Газпром -->
        <div class="stock-row">
            <div class="stock-main-info">
                <div class="stock-avatar" style="color: #2962ff; background: rgba(41,98,255,0.1);">Г</div>
                <div class="stock-meta">
                    <span class="stock-name">Газпром</span>
                    <span class="stock-ticker">MOEX → GAZP</span>
                </div>
            </div>
            <div class="stock-sparkline">
                <canvas id="chart-gazp"></canvas>
            </div>
            <div class="stock-financials">
                <div class="stock-price">128,45 ₽</div>
                <div class="stock-change up">+0,85%</div>
            </div>
        </div>

        <!-- Сбербанк -->
        <div class="stock-row">
            <div class="stock-main-info">
                <div class="stock-avatar" style="color: #2ebd85; background: rgba(46,189,133,0.1);">С</div>
                <div class="stock-meta">
                    <span class="stock-name">Сбербанк</span>
                    <span class="stock-ticker">MOEX → SBER</span>
                </div>
            </div>
            <div class="stock-sparkline">
                <canvas id="chart-sber"></canvas>
            </div>
            <div class="stock-financials">
                <div class="stock-price">245,20 ₽</div>
                <div class="stock-change up">+1,42%</div>
            </div>
        </div>

        <!-- Роснефть -->
        <div class="stock-row">
            <div class="stock-main-info">
                <div class="stock-avatar" style="color: #ff9800; background: rgba(255,152,0,0.1);">Р</div>
                <div class="stock-meta">
                    <span class="stock-name">Роснефть</span>
                    <span class="stock-ticker">MOEX → ROSN</span>
                </div>
            </div>
            <div class="stock-sparkline">
                <canvas id="chart-rosn"></canvas>
            </div>
            <div class="stock-financials">
                <div class="stock-price">349,55 ₽</div>
                <div class="stock-change down">-0,68%</div>
            </div>
        </div>

    </div>

    <script type="text/javascript">
        // Данные для микро-графиков (тренды движения цены)
        const sparklinesData = {
            'chart-gazp': { points:, color: '#2ebd85' },
            'chart-sber': { points:, color: '#2ebd85' },
            'chart-rosn': { points:, color: '#f6465d' }
        };

        // Функция отрисовки маленьких графиков-линий
        function drawSparkline(canvasId) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            
            // Настройка размеров холста
            canvas.width = canvas.offsetWidth * dpr;
            canvas.height = canvas.offsetHeight * dpr;
            ctx.scale(dpr, dpr);

            const width = canvas.offsetWidth;
            const height = canvas.offsetHeight;
            const data = sparklinesData[canvasId];
            const points = data.points;

            ctx.clearRect(0, 0, width, height);

            // Расчет координат точек
            const minVal = Math.min(...points);
            const maxVal = Math.max(...points);
            const stepX = width / (points.length - 1);

            ctx.strokeStyle = data.color;
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            
            ctx.beginPath();
            
            for (let i = 0; i < points.length; i++) {
                const x = i * stepX;
                // Защита от деления на ноль, если все точки равны
                const y = maxVal === minVal ? height / 2 : height - ((points[i] - minVal) / (maxVal - minVal)) * height;
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
        }

        // Запуск генерации интерфейса
        window.onload = () => {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            
            // Отрисовываем каждый микро-график
            Object.keys(sparklinesData).forEach(id => drawSparkline(id));
        };
    </script>
</body>
</html>
