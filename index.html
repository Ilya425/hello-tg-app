<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOEX Stock Tracker</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #131722;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Кнопки переключения акций */
        .tabs-container {
            display: flex;
            justify-content: space-around;
            background-color: #1c2030;
            padding: 12px 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .tab-button {
            background-color: #2a2e39;
            color: #b2b5be;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-grow: 1;
            margin: 0 4px;
            text-align: center;
        }

        /* Стиль для активной выбранной кнопки */
        .tab-button.active {
            background-color: #2962ff; /* Фирменный синий цвет */
            color: #ffffff;
            box-shadow: 0 0 8px rgba(41, 98, 255, 0.5);
        }

        /* Контейнер виджета — теперь занимает 70% высоты экрана */
        .chart-section {
            height: 70vh; 
            width: 100%;
            background-color: #131722;
        }

        /* Нижний блок для красоты, чтобы экран снизу не был пустым */
        .footer-info {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #131722;
            padding: 15px;
            border-top: 1px solid #2a2e39;
        }

        .footer-info p {
            margin: 0;
            font-size: 14px;
            color: #848e9c;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Меню выбора бумаг -->
    <div class="tabs-container">
        <button class="tab-button active" onclick="changeSymbol('MOEX:GAZP', this)">Газпром</button>
        <button class="tab-button" onclick="changeSymbol('MOEX:SBER', this)">Сбербанк</button>
        <button class="tab-button" onclick="changeSymbol('MOEX:ROSN', this)">Роснефть</button>
    </div>

    <!-- Область графика -->
    <div class="chart-section">
        <div id="tv-widget-holder" style="height:100%; width:100%;"></div>
    </div>

    <!-- Нижняя плашка -->
    <div class="footer-info">
        <p>💡 Нажимайте на кнопки сверху для переключения котировок в реальном времени</p>
    </div>

    <!-- Загружаем сам скрипт TradingView -->
    <script type="text/javascript" src="https://tradingview.com" async></script>

    <script type="text/javascript">
        // Переменная для хранения настроек виджета
        let widgetConfig = {
            "autosize": true,
            "symbol": "MOEX:GAZP", // Первая бумага при старте
            "interval": "D",
            "timezone": "Europe/Moscow",
            "theme": "dark",
            "style": "1",
            "locale": "ru",
            "enable_publishing": false,
            "allow_symbol_change": false,
            "calendar": false,
            "support_host": "https://www.tradingview.com"
        };

        // Функция создания виджета
        function renderWidget() {
            const holder = document.getElementById('tv-widget-holder');
            holder.innerHTML = ''; // Очищаем старый график

            const script = document.createElement('script');
            script.type = 'text/javascript';
            script.src = 'https://tradingview.com';
            script.async = true;
            script.text = JSON.stringify(widgetConfig);
            
            holder.appendChild(script);
        }

        // Функция смены тикера при клике на вкладку
        function changeSymbol(newSymbol, buttonElement) {
            // Если кликнули на уже активный тикер — ничего не делаем
            if (widgetConfig.symbol === newSymbol) return;

            // Меняем активный класс у кнопок
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            // Обновляем тикер в конфигурации и перерисовываем график
            widgetConfig.symbol = newSymbol;
            renderWidget();
        }

        // Старт скриптов
        window.onload = () => {
            renderWidget();
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand(); // Разворачиваем окно ТГ Mini App на максимум
        };
    </script>
</body>
</html>
