<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOEX Stock Tracker</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #131722;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ИСПРАВЛЕНО: Контейнер-лента со скроллом для тикеров */
        .tabs-scroll-container {
            display: flex;
            gap: 8px;
            background-color: #1c2030;
            padding: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 10;
            overflow-x: auto; /* Включаем горизонтальную прокрутку */
            white-space: nowrap; /* Запрещаем перенос кнопок на новую строку */
            scroll-behavior: smooth; /* Плавный скролл */
            -webkit-overflow-scrolling: touch; /* Плавный скролл на iOS */
        }

        /* Скрываем некрасивый стандартный полосу прокрутки (скроллбар) */
        .tabs-scroll-container::-webkit-scrollbar {
            display: none;
        }

        /* Кнопки теперь фиксированной ширины, чтобы их можно было листать */
        .tab-button {
            background-color: #2a2e39;
            color: #b2b5be;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0; /* Запрещаем кнопкам сжиматься */
            display: inline-block;
        }

        .tab-button.active {
            background-color: #2962ff;
            color: #ffffff;
            box-shadow: 0 0 8px rgba(41, 98, 255, 0.5);
        }

        /* Область графиков (70% экрана) */
        .chart-section {
            height: 70vh; 
            width: 100%;
            background-color: #131722;
            position: relative;
        }

        .chart-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .chart-wrapper.active {
            display: block;
        }

        /* Нижний блок */
        .footer-info {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #131722;
            padding: 15px;
            border-top: 1px solid #2a2e39;
        }

        .footer-info p {
            margin: 0;
            font-size: 14px;
            color: #848e9c;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Меню со скроллом (сюда теперь можно дописывать сколько угодно компаний) -->
    <div class="tabs-scroll-container">
        <button class="tab-button active" onclick="switchTab('gazp', this)">Газпром</button>
        <button class="tab-button" onclick="switchTab('sber', this)">Сбербанк</button>
        <button class="tab-button" onclick="switchTab('rosn', this)">Роснефть</button>
        <!-- Для теста скролла добавим еще пару компаний-пустышек, график подгрузится для трех основных -->
        <button class="tab-button" onclick="alert('Для Лукойла нужно добавить блок графика в код ниже')">Лукойл</button>
        <button class="tab-button" onclick="alert('Для Яндекса нужно добавить блок графика в код ниже')">Яндекс</button>
        <button class="tab-button" onclick="alert('Для Магнита нужно добавить блок графика в код ниже')">Магнит</button>
    </div>

    <!-- Область графиков -->
    <div class="chart-section">
        
        <!-- Газпром -->
        <div id="widget-gazp" class="chart-wrapper active">
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
                <script type="text/javascript" src="https://tradingview.com" async>
                {"autosize": true, "symbol": "MOEX:GAZP", "interval": "D", "timezone": "Europe/Moscow", "theme": "dark", "style": "1", "locale": "ru", "enable_publishing": false, "allow_symbol_change": false, "calendar": false, "support_host": "https://tradingview.com"}
                </script>
            </div>
        </div>

        <!-- Сбербанк -->
        <div id="widget-sber" class="chart-wrapper">
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
                <script type="text/javascript" src="https://tradingview.com" async>
                {"autosize": true, "symbol": "MOEX:SBER", "interval": "D", "timezone": "Europe/Moscow", "theme": "dark", "style": "1", "locale": "ru", "enable_publishing": false, "allow_symbol_change": false, "calendar": false, "support_host": "https://tradingview.com"}
                </script>
            </div>
        </div>

        <!-- Роснефть -->
        <div id="widget-rosn" class="chart-wrapper">
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
                <script type="text/javascript" src="https://tradingview.com" async>
                {"autosize": true, "symbol": "MOEX:ROSN", "interval": "D", "timezone": "Europe/Moscow", "theme": "dark", "style": "1", "locale": "ru", "enable_publishing": false, "allow_symbol_change": false, "calendar": false, "support_host": "https://tradingview.com"}
                </script>
            </div>
        </div>

    </div>

    <!-- Нижняя плашка -->
    <div class="footer-info">
        <p>💡 Листайте верхнюю панель пальцем влево-вправо, чтобы увидеть все доступные тикеры!</p>
    </div>

    <script type="text/javascript">
        function switchTab(companyId, buttonElement) {
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            const wrappers = document.querySelectorAll('.chart-wrapper');
            wrappers.forEach(wrap => wrap.classList.remove('active'));
            
            const targetWidget = document.getElementById('widget-' + companyId);
            if(targetWidget) {
                targetWidget.classList.add('active');
            }
        }

        window.onload = () => {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        };
    </script>
</body>
</html>
