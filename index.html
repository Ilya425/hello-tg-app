<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Cat Mini App</title>
    <!-- Подключаем скрипт без протокола, так он точно не обрежется -->
    <script src="//telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fbfbfb;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Наш котик теперь — это текстовый эмодзи огромного размера */
        #cat {
            position: absolute;
            top: 45vh;
            left: 0px;
            font-size: 70px; /* Размер котика */
            line-height: 1;
            user-select: none;
            transition: transform 0.1s linear;
        }
    </style>
</head>
<body>

    <!-- Наш пиксельный котик прямо в коде! -->
    <div id="cat">🐈</div>

    <script>
        window.Telegram.WebApp.ready();

        const cat = document.getElementById('cat');
        let posX = 0;
        let speed = 5; // Скорость бега котика
        let direction = 1;

        function animateCat() {
            const screenWidth = window.innerWidth;
            const catWidth = cat.offsetWidth;

            posX += speed * direction;

            if (posX + catWidth >= screenWidth && direction === 1) {
                direction = -1;
                cat.style.transform = 'scaleX(-1)'; // Разворот влево
            }
            else if (posX <= 0 && direction === -1) {
                direction = 1;
                cat.style.transform = 'scaleX(1)';  // Разворот вправо
            }

            cat.style.left = posX + 'px';
            requestAnimationFrame(animateCat);
        }

        window.onload = () => {
            animateCat();
        };
    </script>
</body>
</html>
