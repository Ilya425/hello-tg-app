<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazprom Stock Chart</title>
    <script src="//telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #131722;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Шапка приложения */
        .header {
            padding: 15px;
            text-align: center;
            background-color: #1c2030;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        .header p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: #848e9c;
        }

        /* Контейнер для iframe-графика */
        .chart-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }

        /* Сам фрейм графика */
        .chart-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <h1>ПАО «Газпром»</h1>
        <p>Котировки акций (MOEX: GAZP)</p>
    </div>

    <!-- График через прямой Iframe от TradingView -->
    <div class="chart-container">
        <iframe src="https://tradingview.com"></iframe>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand(); // Раскрываем приложение на весь экран
    </script>
</body>
</html>
