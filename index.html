<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazprom Stock Chart</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #131722;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 15px;
            text-align: center;
            background-color: #1c2030;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        .header p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: #848e9c;
        }

        /* Контейнер виджета */
        .tradingview-widget-container {
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 74px); /* Вычитаем высоту шапки */
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ПАО «Газпром»</h1>
        <p>Котировки акций (MOEX: GAZP)</p>
    </div>

    <!-- Встраиваем код виджета через официальный JS-загрузчик TradingView -->
    <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
        {
            "autosize": true,
            "symbol": "MOEX:GAZP",
            "interval": "D",
            "timezone": "Europe/Moscow",
            "theme": "dark",
            "style": "1",
            "locale": "ru",
            "enable_publishing": false,
            "allow_symbol_change": false,
            "calendar": false,
            "support_host": "https://www.tradingview.com"
        }
        </script>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand(); // Разворачиваем на максимум
    </script>
</body>
</html>
