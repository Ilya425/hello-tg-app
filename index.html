<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOEX Stock Tracker</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #131722;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Контейнер со скроллом для кнопок */
        .tabs-scroll-container {
            display: flex;
            gap: 8px;
            background-color: #1c2030;
            padding: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 10;
            overflow-x: auto;
            white-space: nowrap;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .tabs-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .tab-button {
            background-color: #2a2e39;
            color: #b2b5be;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            display: inline-block;
        }

        .tab-button.active {
            background-color: #2962ff;
            color: #ffffff;
            box-shadow: 0 0 8px rgba(41, 98, 255, 0.5);
        }

        /* Область отображения графика (70% высоты экрана) */
        .chart-section {
            height: 70vh; 
            width: 100%;
            background-color: #131722;
            position: relative;
        }

        /* Стили для фреймов — они занимают всю доступную область */
        .chart-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        .chart-iframe.active {
            display: block;
        }

        /* Нижний информационный блок */
        .footer-info {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #131722;
            padding: 15px;
            border-top: 1px solid #2a2e39;
        }

        .footer-info p {
            margin: 0;
            font-size: 14px;
            color: #848e9c;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Панель переключения компаний с прокруткой -->
    <div class="tabs-scroll-container">
        <button class="tab-button active" onclick="switchChart('gazp', this)">Газпром</button>
        <button class="tab-button" onclick="switchChart('sber', this)">Сбербанк</button>
        <button class="tab-button" onclick="switchChart('rosn', this)">Роснефть</button>
        <button class="tab-button" onclick="switchChart('lkoh', this)">Лукойл</button>
        <button class="tab-button" onclick="switchChart('yndx', this)">Яндекс</button>
    </div>

    <!-- Область графиков (используем стабильные iframe-виджеты) -->
    <div class="chart-section">
        <!-- Газпром -->
        <iframe id="iframe-gazp" class="chart-iframe active" src="https://tradingview.com"></iframe>
        
        <!-- Сбербанк -->
        <iframe id="iframe-sber" class="chart-iframe" src="https://tradingview.com"></iframe>
        
        <!-- Роснефть -->
        <iframe id="iframe-rosn" class="chart-iframe" src="https://tradingview.com"></iframe>

        <!-- Лукойл -->
        <iframe id="iframe-lkoh" class="chart-iframe" src="https://tradingview.com"></iframe>

        <!-- Яндекс -->
        <iframe id="iframe-yndx" class="chart-iframe" src="https://tradingview.com"></iframe>
    </div>

    <!-- Нижняя плашка -->
    <div class="footer-info">
        <p>💡 Ленту сверху можно листать пальцем! Добавлены новые компании.</p>
    </div>

    <script type="text/javascript">
        function switchChart(id, buttonElement) {
            // Переключаем активный стиль у кнопок в скроллбаре
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            // Скрываем все графики и показываем нужный
            const iframes = document.querySelectorAll('.chart-iframe');
            iframes.forEach(iframe => iframe.classList.remove('active'));
            
            const targetIframe = document.getElementById('iframe-' + id);
            if (targetIframe) {
                targetIframe.classList.add('active');
            }
        }

        window.onload = () => {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        };
    </script>
</body>
</html>
