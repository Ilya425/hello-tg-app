<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#29292f">
<title>MOEX Stocks</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#303036;--panel:#29292f;--panel2:#3b3b42;--line:#4a4a51;
  --text:#f4f4f6;--muted:#b9b9bf;--green:#78ef8a;--red:#df686f;
  --teal:#45d0c2;--pink:#ff4f87;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{min-height:100vh}
button,input{font:inherit}
button{border:0;background:none;color:inherit}
.app{min-height:100vh;max-width:520px;margin:auto;background:var(--bg);padding-bottom:164px}
.header-space{height:0}

.filter{
  height:82px;background:var(--panel2);display:flex;align-items:center;
  justify-content:space-between;padding:12px 22px;
  box-shadow:0 5px 14px rgba(0,0,0,.25)
}
.filter-title{font-size:19px;line-height:1.1}
.filter-sub{font-size:13px;color:#bdbdc3;margin-top:9px}
.arrow{color:#61d97a;font-size:18px;margin-left:18px}
.clock{font-size:29px;opacity:.95;cursor:pointer}

.search{display:none;margin:12px 14px;height:46px;padding:0 14px;border-radius:12px;background:#45454c;align-items:center;gap:8px}
.search.show{display:flex}
.search input{flex:1;background:none;border:0;outline:0;color:#fff}
.search input::placeholder{color:#aaa}


.index-block{
  min-width:118px;
  text-align:right;
  padding-top:2px;
}
.index-value{
  font-size:22px;
  line-height:1.05;
  font-weight:600;
}
.index-value.up-index{color:var(--green)}
.index-value.down-index{color:var(--red)}
.index-label{
  margin-top:6px;
  color:#bdbdc3;
  font-size:14px;
  line-height:1;
  white-space:nowrap;
}

/* LIST */
.list-row{
  min-height:82px;
  display:grid;
  grid-template-columns:14% 27% 22% minmax(0,37%);
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border-bottom:2px solid var(--line);
  cursor:pointer;
}
.logo{
  width:52px;height:52px;
  border-radius:50%;
  display:grid;place-items:center;
  text-align:center;
  font-weight:800;
  font-size:14px;
  border:1px solid rgba(255,255,255,.12);
}
.logo.red{background:#f21f43;color:#fff}
.logo.yellow{background:#ffc82e;color:#111}
.logo.blue{background:#0c0e14;color:#21d7ff}
.logo.white{background:#f5f5f7;color:#333}
.logo.green{background:#879e73;color:#8b1018}
.logo.orange{background:#f7941d;color:#fff}

.list-right{min-width:0;overflow:hidden}
.name{
  font-size:18px;
  font-weight:650;
  line-height:1.05;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.ticker{
  display:block;
  margin-top:5px;
  font-size:12px;
  line-height:1;
  color:#bdbdc3;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.spark{
  width:100%;
  height:44px;
  display:block;
}
.spark path{
  fill:none;
  stroke-width:3.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.spark line{stroke-width:1.8;stroke-dasharray:5 5;opacity:.75}

.list-price{
  text-align:right;
  font-size:22px;
  line-height:1.05;
  white-space:nowrap;
}
.list-change{
  text-align:right;
  font-size:15px;
  line-height:1.1;
  color:var(--green);
  white-space:nowrap;
  margin-top:5px;
}
.list-change.red{color:var(--red)}


.logo.img-logo{
  overflow:hidden;
  background:#f4f4f5;
}
.logo.img-logo img{
  width:72%;
  height:72%;
  object-fit:contain;
  display:block;
}
.card .logo.img-logo img{
  width:76%;
  height:76%;
}


.detail-summary{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:18px;
}
.detail-multiples{
  min-width:112px;
  display:grid;
  gap:8px;
  padding-left:15px;
  border-left:1px solid rgba(255,255,255,.12);
}
.detail-multiples div{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  white-space:nowrap;
}
.detail-multiples span{
  color:#aaa;
  font-size:11px;
}
.detail-multiples b{
  color:#f3f3f5;
  font-size:15px;
  font-weight:600;
}

/* MAP */
#mapView{
  display:none;
  padding:10px 11px 12px;
  background:#303036;
}
.map-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}
.card{
  min-height:142px;
  position:relative;
  border-radius:11px;
  padding:10px 8px 8px;
  overflow:hidden;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  border:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 2px 8px rgba(0,0,0,.12);
}
.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 38%);
  pointer-events:none;
}
.card.up-dark{background:#237c2c}.card.up{background:#35a844}
.card.up-light{background:#78c77f}.card.down{background:#c95860}
.card.down-dark{background:#9f2428}.card.neutral{background:#9a8a60}
.card-head{
  position:absolute;
  z-index:2;
  top:9px;
  left:9px;
  right:8px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:6px;
  min-width:0;
}
.card .logo{
  width:30px;
  height:30px;
  min-width:30px;
  flex:0 0 30px;
  font-size:10px;
  border:0;
  background:transparent;
  box-shadow:none;
}
.card .logo svg{
  width:100%;
  height:100%;
  display:block;
}
.card-ticker{
  min-width:0;
  max-width:calc(100% - 36px);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:16px;
  font-weight:700;
  line-height:1;
  color:#fff;
}
.card-price{
  position:relative;
  z-index:1;
  margin-top:42px;
  font-size:20px;
  font-weight:500;
  line-height:1;
  white-space:nowrap;
  color:#fff;
}
.card-change{
  position:relative;
  z-index:1;
  margin-top:9px;
  font-size:14px;
  font-weight:650;
  line-height:1;
  white-space:nowrap;
  color:#fff;
}
.card-metrics{
  position:relative;
  z-index:1;
  margin-top:auto;
  width:100%;
  padding-top:6px;
  border-top:1px solid rgba(255,255,255,.18);
  display:flex;
  justify-content:center;
  gap:8px;
  font-size:9px;
  line-height:1;
  color:rgba(255,255,255,.78);
  white-space:nowrap;
}
.card-metrics b{font-size:9px;color:#fff}
/* SUBMENU */
.subnav{
  position:fixed;
  left:50%;
  bottom:86px;
  transform:translateX(-50%);
  width:100%;
  max-width:520px;
  height:60px;
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#414147;
  border:1px solid #505058;
  border-radius:7px 7px 0 0;
  z-index:30;
  overflow:hidden;
}
.subbtn{
  position:relative;
  width:100%;
  height:100%;
  padding:5px 0 6px;
  font-size:16px;
  font-weight:600;
  color:#c4c4c8;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  line-height:1;
}
.subbtn .miniico,
.subbtn .listico{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:25px;
  font-size:23px;
  line-height:1;
}
.subbtn .listico{
  letter-spacing:-4px;
  padding:0;
}
.subbtn.active{color:var(--pink)}
.subbtn.active::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:3px;
  background:var(--pink);
}

/* FOOTER */
.bottom{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;
  height:86px;background:#28282e;border-top:1px solid #47474d;z-index:31;
  padding-bottom:max(5px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr)
}
.nav{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;padding-bottom:7px;color:#bcbcc1}
.nav .ico{font-size:29px;line-height:1;height:32px;display:flex;align-items:center;justify-content:center}
.listing-icon{
  width:32px !important;
  height:32px !important;
  transform:none;
}
.listing-icon svg{
  width:29px;
  height:27px;
  display:block;
}
.nav span{font-size:15px;line-height:18px;height:18px;white-space:nowrap}.nav.active{color:var(--teal)}
.market-symbol{
  width:46px;height:32px;
  display:flex;align-items:center;justify-content:center;
  font-size:27px;line-height:1;
  color:var(--teal);
  margin:0 0 6px;
  align-self:center;
}

/* DETAIL */
.detail{display:none;min-height:100vh;background:var(--bg)}
.detail.show{display:block}
.detail-head{height:75px;background:var(--panel);display:flex;align-items:center;gap:12px;padding:0 18px}
.back{font-size:36px}.detail-title strong{display:block;font-size:20px}.detail-title span{font-size:15px;color:#aaa}
.hero{padding:25px 18px;background:var(--panel)}
.bigprice{font-size:36px}.bigchange{font-size:19px;margin-top:7px;color:var(--green)}
.chartbox{margin-top:18px;background:#38383f;border-radius:15px;padding:15px}
.chart{width:100%;height:230px;display:block;min-height:230px}
.periods{display:flex;justify-content:space-between;color:#aaa}.periods button{padding:7px 10px;border-radius:8px}
.periods button.active{background:#505058;color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.stat{background:var(--bg);padding:17px 20px}.stat small{display:block;color:#aaa;margin-bottom:6px}
.alert{display:block;margin:18px auto;padding:15px;width:calc(100% - 40px);border-radius:12px;background:var(--pink);color:#fff;font-weight:700}

.empty{padding:45px 20px;text-align:center;color:#aaa}

@media(max-width:410px){
  .list-row{
    grid-template-columns:13% 28% 21% minmax(0,38%);
    min-height:76px;
    gap:4px;
    padding-left:7px;
    padding-right:7px;
  }
  .logo{width:46px;height:46px;font-size:13px}
  .name{font-size:15px}
  .ticker{font-size:11px;margin-top:4px}
  .spark{height:40px}
  .list-price{font-size:19px}
  .list-change{font-size:13px;margin-top:4px}
  .map-grid{gap:8px}
  .card{min-height:132px;padding:8px 6px;border-radius:10px}
  .card .logo{width:28px;height:28px;min-width:28px}
  .card-ticker{font-size:15px}
  .card-price{font-size:17px}
  .card-change{font-size:13px}
  .subnav{height:58px}
  .subbtn{font-size:15px;padding-top:4px;padding-bottom:6px;gap:3px}
  .subbtn .miniico,.subbtn .listico{font-size:21px;height:24px}
  .bottom{height:86px}
  .nav span{font-size:14px}
  .nav .ico{font-size:27px;height:32px}
  .listing-icon{width:31px !important;height:31px !important}
  .listing-icon svg{width:28px;height:26px}
  .market-symbol{width:44px;height:32px;font-size:25px;margin-bottom:6px}
  .detail-summary{gap:10px}
  .detail-multiples{min-width:104px;padding-left:11px;gap:7px}
  .detail-multiples span{font-size:10px}
  .detail-multiples b{font-size:14px}
}
</style>
</head>
<body>
<div class="app">
<section id="market">
  <div class="filter">
    <div>
      <div class="filter-title">Изменение цены <span class="arrow">▼</span></div>
      <div class="filter-sub">Акции МОEX</div>
    </div>
    <div class="index-block">
      <div class="index-value up-index" id="moexValue">2286</div>
      <div class="index-label">Индекс МОЕХ</div>
    </div>
  </div>

  <div class="search" id="searchBox">
    <span>⌕</span><input id="search" placeholder="Найти акцию..." oninput="render()">
  </div>

  <div id="listView"></div>
  <div id="mapView"><div class="map-grid" id="mapGrid"></div></div>
</section>

<section id="detail" class="detail">
  <div class="detail-head">
    <button class="back" onclick="closeDetail()">‹</button>
    <div class="detail-title" id="detailTitle"></div>
  </div>
  <div class="hero">
    <div class="detail-summary">
        <div class="detail-main-values">
          <div class="bigprice" id="detailPrice"></div>
          <div class="bigchange" id="detailChange"></div>
        </div>
        <div class="detail-multiples">
          <div><span>P/E</span><b id="detailPE">—</b></div>
          <div><span>EV/EBITDA</span><b id="detailEV">—</b></div>
        </div>
      </div>
      <div class="chartbox">
      <svg id="detailChart" class="chart" viewBox="0 0 600 230" preserveAspectRatio="none"></svg>
      <div class="periods"><button>1Д</button><button class="active">1Н</button><button>1М</button><button>3М</button><button>1Г</button></div>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <button class="alert" onclick="setAlert()">🔔 Установить уведомление</button>
</section>
</div>

<div class="subnav" id="subnav">
  <button id="listBtn" class="subbtn active" onclick="setView('list')"><span class="listico">☷</span>СПИСОК</button>
  <button id="mapBtn" class="subbtn" onclick="setView('map')"><span class="miniico">⊞</span>КАРТА</button>
</div>

<nav class="bottom">
  <button class="nav" onclick="tab('Импульсы')"><div class="ico">✣</div><span>Импульсы</span></button>
  <button class="nav active"><div class="market-symbol">◆</div><span>IMOEX</span></button>
  <button class="nav" onclick="tab('Листинг')"><div class="ico listing-icon" aria-hidden="true">
      <svg viewBox="0 0 32 28">
        <path d="M4 24V5M4 24H29" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M8 19l5-5 4 3 7-8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="24" cy="9" r="2.2" fill="currentColor"/>
      </svg>
    </div><span>Листинг</span></button>
  <button class="nav" onclick="tab('Поток')"><div class="ico">◉</div><span>Поток</span></button>
  <button class="nav" onclick="tab('Профиль')"><div class="ico">⚙</div><span>Профиль</span></button>
</nav>

function spark(a,up){
 const min=Math.min(...a),max=Math.max(...a);
 const pts=a.map((v,i)=>[i*112/(a.length-1),48-(v-min)/(max-min||1)*42]);
 const d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
 return '<svg class="spark" viewBox="0 0 112 50"><line x1="0" y1="'+pts[pts.length-1][1]+'" x2="112" y2="'+pts[pts.length-1][1]+'" stroke="'+(up?'#59d18a':'#e05e68')+'"/><path d="'+d+'" stroke="'+(up?'#4ea987':'#c95761')+'"/></svg>';
}

function render(){
 const q=(document.getElementById('search')?.value||'').trim().toLowerCase();
 const list=stocks.filter(s=>!q||s.t.toLowerCase().includes(q)||s.n.toLowerCase().includes(q));

 document.getElementById('listView').innerHTML=list.map(s=>`
  <article class="list-row" onclick="openDetail('${s.t}')">
    <div class="logo img-logo ${s.cl}">${logoSvg[s.t]||s.l}</div>
    <div class="list-right"><div class="name">${s.n}</div><div class="ticker">MOEX → ${s.t}</div></div>
    ${spark(s.a,s.up)}
    <div><div class="list-price">${s.p}</div><div class="list-change ${s.up?'':'red'}">${s.c} (${s.d})</div></div>
  </article>
 `).join('') || '<div class="empty">Ничего не найдено</div>';

 document.getElementById('mapGrid').innerHTML=list.map(s=>`
  <article class="card ${s.card}" onclick="openDetail('${s.t}')">
    <div class="card-head">
      <div class="logo img-logo ${s.cl}">${logoSvg[s.t]||s.l}</div>
      <div class="card-ticker">${s.t}</div>
    </div>
    <div class="card-price">${s.p}</div>
    <div class="card-change">${s.c}</div>
    <div class="card-metrics">
      <span>P/E <b>${s.pe||'—'}</b></span>
      <span>EV/EBITDA <b>${s.ev||'—'}</b></span>
    </div>
  </article>
 `).join('');
}

function drawChart(a,up){
 const min=Math.min(...a), max=Math.max(...a), base=220;
 const step=600/a.length, barW=Math.max(8,step-8);
 let out='<line x1="0" y1="'+base+'" x2="600" y2="'+base+'" stroke="#777" stroke-width="1" opacity=".35"/>';
 a.forEach((v,i)=>{
   const h=25+(v-min)/(max-min||1)*165;
   const x=4+i*step, y=base-h;
   const rising=i===0?up:a[i]>=a[i-1];
   const fill=rising?'#59c98a':'#df6069';
   out+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+fill+'"/>';
 });
 document.getElementById('detailChart').innerHTML=out;
}

<script>
/* =========================
   STAGE 1 — LIVE MOEX DATA
   ========================= */
const API_BASE = 'https://hello-tg-app.onrender.com';
let liveRefreshInFlight = false;
const liveCandleCache = new Map();
const liveQuotes = new Map();

function livePrice(v){
  const n = Number(v);
  if(!Number.isFinite(n)) return '—';
  const d = Math.abs(n) >= 1000 ? 1 : Math.abs(n) >= 100 ? 2 : 3;
  return n.toLocaleString('ru-RU',{
    minimumFractionDigits:d, maximumFractionDigits:d
  }) + ' ₽';
}
function livePct(v){
  const n = Number(v);
  if(!Number.isFinite(n)) return '—';
  const sign = n > 0 ? '+' : '';
  return sign + n.toLocaleString('ru-RU',{
    minimumFractionDigits:2, maximumFractionDigits:2
  }) + '%';
}
function liveAbs(v){
  const n = Number(v);
  if(!Number.isFinite(n)) return '';
  const sign = n > 0 ? '+' : '';
  return sign + n.toLocaleString('ru-RU',{
    minimumFractionDigits:0, maximumFractionDigits:3
  }) + ' ₽';
}

async function apiMarket(){
  const r = await fetch(API_BASE + '/api/market', {cache:'no-store'});
  if(!r.ok) throw new Error('market ' + r.status);
  return r.json();
}
async function apiCandles(ticker, interval=60, days=14){
  const key = `${ticker}|${interval}|${days}`;
  const cached = liveCandleCache.get(key);
  if(cached && Date.now() - cached.ts < 60000) return cached.data;

  const url = API_BASE + '/api/candles?symbol=' + encodeURIComponent(ticker) +
    '&interval=' + interval + '&days=' + days;
  const r = await fetch(url, {cache:'no-store'});
  if(!r.ok) throw new Error('candles ' + r.status);
  const data = await r.json();
  liveCandleCache.set(key,{ts:Date.now(),data});
  return data;
}

async function refreshLiveMarket(){
  if(liveRefreshInFlight) return;
  liveRefreshInFlight = true;
  try{
    const data = await apiMarket();
    const idx = data.index || {};
    const ivalue = Number(idx.value);
    const ichange = Number(idx.change);

    if(Number.isFinite(ivalue)){
      moexIndex = ivalue;
      const el = document.getElementById('moexValue');
      if(el){
        el.textContent = ivalue.toLocaleString('ru-RU',{
          minimumFractionDigits:0, maximumFractionDigits:2
        });
        el.classList.toggle('up-index', !Number.isFinite(ichange) || ichange >= 0);
        el.classList.toggle('down-index', Number.isFinite(ichange) && ichange < 0);
      }
    }

    for(const q of (data.quotes || [])){
      const s = stocks.find(x => x.t === q.ticker);
      if(!s) continue;
      const p = Number(q.price), pct = Number(q.change_pct), abs = Number(q.change_abs);
      if(Number.isFinite(p)) s.p = livePrice(p);
      if(Number.isFinite(pct)){
        s.c = livePct(pct);
        s.up = pct >= 0;
      }
      if(Number.isFinite(abs)) s.d = liveAbs(abs);
      if(Array.isArray(q.spark) && q.spark.length > 1) s.a = q.spark;
      liveQuotes.set(q.ticker,{price:p,pct,abs});
    }
    render();
  }catch(err){
    console.warn('Live MOEX unavailable:',err);
  }finally{
    liveRefreshInFlight = false;
  }
}

function drawRealCandleBars(candles){
  const svg = document.getElementById('detailChart');
  if(!svg || !candles?.length) return;

  const W=600, top=12, base=215;
  const highs=candles.map(c=>Number(c.high)).filter(Number.isFinite);
  const lows=candles.map(c=>Number(c.low)).filter(Number.isFinite);
  if(!highs.length || !lows.length) return;

  const min=Math.min(...lows), max=Math.max(...highs);
  const y=v => base - ((v-min)/(max-min || 1))*(base-top);
  const step=W/candles.length, candleW=Math.max(4,step*.58);

  let out=`<line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="#777" stroke-width="1" opacity=".35"/>`;

  candles.forEach((c,i)=>{
    const o=Number(c.open),cl=Number(c.close),hi=Number(c.high),lo=Number(c.low);
    if(![o,cl,hi,lo].every(Number.isFinite)) return;
    const x=i*step+step/2, color=cl>=o?'#59c98a':'#df6069';
    const yh=y(hi),yl=y(lo),yo=y(o),yc=y(cl);
    const bodyY=Math.min(yo,yc), bodyH=Math.max(2,Math.abs(yc-yo));
    out += `<line x1="${x.toFixed(1)}" y1="${yh.toFixed(1)}" x2="${x.toFixed(1)}" y2="${yl.toFixed(1)}" stroke="${color}" stroke-width="2"/>`;
    out += `<rect x="${(x-candleW/2).toFixed(1)}" y="${bodyY.toFixed(1)}" width="${candleW.toFixed(1)}" height="${bodyH.toFixed(1)}" rx="1.5" fill="${color}"/>`;
  });
  svg.innerHTML=out;
}

/* Keep the original UI navigation. Only the stock detail gets live candles. */
const baseOpenDetail = window.openDetail;
window.openDetail = async function(ticker){
  if(typeof baseOpenDetail === 'function') baseOpenDetail(ticker);
  try{
    const data = await apiCandles(ticker,60,14);
    if(data.candles?.length){
      drawRealCandleBars(data.candles);
      const s = stocks.find(x=>x.t===ticker);
      const last = data.candles[data.candles.length-1];
      const prev = data.candles.length>1 ? data.candles[data.candles.length-2] : null;

      const q = liveQuotes.get(ticker);
      // Current quote and daily change come from /api/market.
      // Candles are used only for the historical chart.
      if(q && Number.isFinite(q.price))
        document.getElementById('detailPrice').textContent = livePrice(q.price);

      if(q && Number.isFinite(q.pct)){
        const el=document.getElementById('detailChange');
        el.textContent=livePct(q.pct) + (Number.isFinite(q.abs) ? ' ('+liveAbs(q.abs)+')' : '');
        el.style.color=q.pct>=0?'var(--green)':'var(--red)';
      }

      if(s){
        const pe=document.getElementById('detailPE');
        const ev=document.getElementById('detailEV');
        if(pe) pe.textContent=s.pe||'—';
        if(ev) ev.textContent=s.ev||'—';
        const cells=document.querySelectorAll('#stats .stat');
        if(cells.length>=4){
          cells[2].querySelector('b').textContent=s.c;
          cells[3].querySelector('b').textContent=s.p;
        }
      }
    }
  }catch(err){
    console.warn('Live candles unavailable:',err);
  }
};

refreshLiveMarket();
setInterval(refreshLiveMarket,60000);
</script>
