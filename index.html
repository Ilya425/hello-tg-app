<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#29292f">
<title>MOEX Stocks</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#303036;--panel:#29292f;--panel2:#3a3a41;--line:#4b4b53;--text:#f4f4f6;--muted:#b9b9bf;--green:#78ef8a;--red:#e86b72;--accent:#ff4f87;--teal:#45d0c2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif}button,input{font:inherit}button{border:0;background:none;color:inherit}.app{width:100%;max-width:520px;min-height:100vh;margin:auto;background:var(--bg);padding-bottom:82px;overflow:hidden}.top{position:sticky;top:0;z-index:20;background:var(--panel);padding-top:max(8px,env(safe-area-inset-top));box-shadow:0 3px 12px #0005}.titlebar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.close{font-size:20px}.brand{text-align:center}.brand strong{display:block;font-size:25px}.brand span{color:#aaa;font-size:16px}.more{width:42px;height:42px;border:2px solid #eee;border-radius:50%;font-size:21px;letter-spacing:2px}.filter{display:flex;align-items:center;justify-content:space-between;padding:15px 22px 17px;background:var(--panel2)}.filter .label{font-size:23px}.filter small{display:block;color:#bdbdc2;font-size:17px;margin-top:4px}.down{color:#62db79;margin-left:24px}.clock{font-size:32px}.search{margin:12px 14px 4px;padding:0 15px;height:44px;border-radius:13px;background:#424249;display:none;align-items:center;gap:9px}.search.show{display:flex}.search input{width:100%;background:none;border:0;outline:0;color:white}.stock{min-height:132px;display:grid;grid-template-columns:82px 1fr 145px;align-items:center;gap:4px;padding:10px 16px;border-bottom:2px solid var(--line);cursor:pointer}.logo{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:#17181d;color:#fff;font-weight:800;text-align:center;border:1px solid #fff2}.logo.green{background:#849e72;color:#8b1118;font-size:19px}.logo.yellow{background:#ffc72c;color:#111;font-size:23px}.logo.white{background:#f5f5f7;color:#303036}.logo.blue{background:#0b0d13;color:#18d7ff}.name{font-size:20px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ticker{font-size:16px;color:#bdbdc3;margin-top:7px}.right{text-align:right}.spark{width:112px;height:50px;display:block;margin:0 0 1px auto}.spark path{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.spark line{stroke-width:2;stroke-dasharray:5 5;opacity:.75}.price{font-size:24px;white-space:nowrap}.change{font-size:18px;margin-top:5px;color:var(--green);white-space:nowrap}.change.red{color:var(--red)}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;height:82px;z-index:30;padding-bottom:max(6px,env(safe-area-inset-bottom));background:#28282e;border-top:1px solid #44444b;display:grid;grid-template-columns:repeat(5,1fr)}.nav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#bcbcc1}.nav .ico{font-size:25px;line-height:1}.nav span{font-size:14px}.nav.active{color:var(--teal)}.badge{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#eee;color:#159c32;font-size:16px;margin-top:-17px}.detail{display:none;min-height:100vh;background:var(--bg)}.detail.show{display:block}.detail-head{padding:18px;background:var(--panel);display:flex;align-items:center;gap:12px}.back{font-size:30px}.detail-title strong{display:block;font-size:21px}.detail-title span{color:#aaa;font-size:15px}.hero{padding:24px 20px 18px;background:var(--panel)}.bigprice{font-size:39px;font-weight:600}.bigchange{font-size:20px;color:var(--green);margin-top:7px}.chartbox{margin:14px 0 0;background:#38383f;border-radius:16px;padding:15px}.chart{width:100%;height:220px;display:block}.periods{display:flex;justify-content:space-between;color:#aaa}.periods button{padding:7px 10px;border-radius:8px;color:#aaa}.periods button.active{background:#505058;color:#fff}.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}.stat{background:var(--bg);padding:17px 20px}.stat small{color:#aaa;display:block;margin-bottom:6px}.stat b{font-size:18px}.alert{margin:18px 20px;padding:15px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;text-align:center;width:calc(100% - 40px)}@media(min-width:700px){body{background:#111}.app{box-shadow:0 0 35px #0007}}
</style>
</head>
<body>
<div class="app">
<section id="market">
<header class="top">
<div class="titlebar"><button class="close" onclick="closeApp()">Закрыть</button><div class="brand"><strong>MOEX Stocks</strong><span>мини-приложение</span></div><button class="more" onclick="toggleSearch()">•••</button></div>
<div class="filter"><div><div class="label">Изменение цены <span class="down">▼</span></div><small>Акции МОEX</small></div><div class="clock">◷</div></div>
</header>
<div class="search" id="searchBox">⌕<input id="search" placeholder="Найти акцию..." oninput="renderStocks()"></div>
<main id="stockList"></main>
</section>
<section class="detail" id="detail">
<div class="detail-head"><button class="back" onclick="closeDetail()">‹</button><div class="detail-title" id="detailTitle"></div></div>
<div class="hero"><div class="bigprice" id="detailPrice"></div><div class="bigchange" id="detailChange"></div><div class="chartbox"><svg class="chart" id="detailChart" viewBox="0 0 600 220" preserveAspectRatio="none"></svg><div class="periods"><button>1Д</button><button class="active">1Н</button><button>1М</button><button>3М</button><button>1Г</button></div></div></div>
<div class="stats" id="stats"></div><button class="alert" onclick="setAlert()">🔔 Установить уведомление</button>
</section>
<nav class="bottom"><button class="nav" onclick="tab('Импульсы')"><div class="ico">✣</div><span>Импульсы</span></button><button class="nav active"><div class="badge">2286</div><span>IMOEX</span></button><button class="nav" onclick="tab('Листинг')"><div class="ico">⌁</div><span>Листинг</span></button><button class="nav" onclick="tab('Поток')"><div class="ico">◉</div><span>Поток</span></button><button class="nav" onclick="tab('Профиль')"><div class="ico">⚙</div><span>Профиль</span></button></nav>
</div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const stocks=[
['SBER','Сбербанк','349,85 ₽','+2,41%','+8,24 ₽','СБ','green',1,[35,38,32,42,48,45,55,60,58,68,73,70]],
['LKOH','ЛУКОЙЛ','6 982,0 ₽','+1,84%','+126,0 ₽','Л','yellow',1,[30,35,31,40,45,43,50,56,52,61,66,69]],
['GAZP','Газпром','134,80 ₽','-0,74%','-1,01 ₽','G','blue',0,[70,64,67,59,63,54,51,55,47,43,45,39]],
['YDEX','Яндекс','6 845,0 ₽','+3,22%','+213,0 ₽','Я','white',1,[28,32,31,38,44,40,51,48,60,57,66,72]],
['T','Т-Технологии','4 186,0 ₽','+2,67%','+109,0 ₽','T','yellow',1,[35,30,37,43,41,50,55,51,63,61,68,73]],
['GMKN','Норникель','142,50 ₽','-1,12%','-1,62 ₽','N','blue',0,[70,66,69,62,59,61,54,57,51,47,49,44]],
['NVTK','Новатэк ао','1 029,2 ₽','+5,12%','+50,1 ₽','▶','blue',1,[25,29,27,30,23,38,42,51,60,72,67,76]],
['TATN','Татнефть','694,30 ₽','+1,93%','+13,10 ₽','T','white',1,[35,39,36,43,45,42,49,54,52,59,62,66]],
['ROSN','Роснефть','349,55 ₽','+5,00%','+16,65 ₽','◆','yellow',1,[25,18,22,15,29,35,31,45,40,51,48,53]]];
function spark(a,up){let mi=Math.min(...a),ma=Math.max(...a),p=a.map((v,i)=>[(i*112/(a.length-1)),48-(v-mi)/(ma-mi||1)*42]);let d=p.map((x,i)=>(i?'L':'M')+x[0].toFixed(1)+' '+x[1].toFixed(1)).join(' ');return `<svg class="spark" viewBox="0 0 112 50"><line x1="0" y1="${p[p.length-1][1]}" x2="112" y2="${p[p.length-1][1]}" stroke="${up?'#59d18a':'#e05e68'}"/><path d="${d}" stroke="${up?'#4ea987':'#c95761'}"/></svg>`}
function renderStocks(){let q=document.getElementById('search').value.toLowerCase();document.getElementById('stockList').innerHTML=stocks.filter(s=>!q||s[0].toLowerCase().includes(q)||s[1].toLowerCase().includes(q)).map(s=>`<article class="stock" onclick="openDetail('${s[0]}')"><div class="logo ${s[6]}">${s[5]}</div><div><div class="name">${s[1]}</div><div class="ticker">MOEX → ${s[0]}</div></div><div class="right">${spark(s[7],s[7])}<div class="price">${s[2]}</div><div class="change ${s[7]?'':'red'}">${s[3]} (${s[4]})</div></div></article>`).join('')}
function toggleSearch(){document.getElementById('searchBox').classList.toggle('show');if(document.getElementById('searchBox').classList.contains('show'))document.getElementById('search').focus()}
function openDetail(t){let s=stocks.find(x=>x[0]===t);document.getElementById('market').style.display='none';document.querySelector('.bottom').style.display='none';document.getElementById('detail').classList.add('show');document.getElementById('detailTitle').innerHTML=`<strong>${s[1]}</strong><span>MOEX → ${s[0]}</span>`;document.getElementById('detailPrice').textContent=s[2];document.getElementById('detailChange').textContent=`${s[3]} (${s[4]})`;document.getElementById('detailChange').style.color=s[7]?'var(--green)':'var(--red)';drawChart(s[8],s[7]);document.getElementById('stats').innerHTML=`<div class="stat"><small>Тикер</small><b>${s[0]}</b></div><div class="stat"><small>Биржа</small><b>MOEX</b></div><div class="stat"><small>Изменение</small><b>${s[3]}</b></div><div class="stat"><small>Последняя цена</small><b>${s[2]}</b></div>`;scrollTo(0,0)}
function drawChart(a,up){let mi=Math.min(...a)-3,ma=Math.max(...a)+3,p=a.map((v,i)=>[10+i*580/(a.length-1),205-(v-mi)/(ma-mi)*190]),d=p.map((x,i)=>(i?'L':'M')+x[0]+' '+x[1]).join(' ');document.getElementById('detailChart').innerHTML=`<path d="${d+' L590 210 L10 210 Z'}" fill="url(#g)"/><path d="${d}" fill="none" stroke="${up?'#59c98a':'#df6069'}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="105" x2="600" y2="105" stroke="#777" stroke-dasharray="6 8" opacity=".35"/><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-opacity=".22"/><stop offset="1" stop-opacity="0"/></linearGradient></defs>`}
function closeDetail(){document.getElementById('detail').classList.remove('show');document.getElementById('market').style.display='block';document.querySelector('.bottom').style.display='grid'}
function closeApp(){if(tg)tg.close();else alert('В Telegram Mini App окно закроется.')}
function setAlert(){if(tg?.showAlert)tg.showAlert('Уведомления подключим на следующем этапе — через backend.');else alert('Уведомления подключим на следующем этапе — через backend.')}
function tab(name){if(tg?.showAlert)tg.showAlert(name+' — следующий экран MVP.');else alert(name+' — следующий экран MVP.')}
renderStocks();
</script>
</body></html>
