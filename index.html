<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazprom Stock Chart</title>
    <script src="//telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #131722; /* Тёмная тема как на бирже */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Шапка приложения */
        .header {
            padding: 15px;
            text-align: center;
            background-color: #1c2030;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: #848e9c;
        }

        /* Контейнер для графика TradingView */
        .chart-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
        }

        /* Обёртка для самого информера */
        .tradingview-widget-container {
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <h1>ПАО «Газпром»</h1>
        <p>Котировки акций в реальном времени (MOEX: GAZP)</p>
    </div>

    <!-- График -->
    <div class="chart-container">
        <div class="tradingview-widget-container">
            <div id="tradingview_gazp" style="height: 100%; width: 100%;"></div>
            <!-- Подключаем официальный скрипт виджета TradingView -->
            <script type="text/javascript" src="https://tradingview.com"></script>
            <script type="text/javascript">
                new TradingView.widget({
                    "autosize": true,
                    "symbol": "MOEX:GAZP",    /* Указываем тикер Газпрома на Мосбирже */
                    "interval": "D",           /* Интервал по умолчанию - 1 день */
                    "timezone": "Europe/Moscow",
                    "theme": "dark",           /* Стильная тёмная тема */
                    "style": "1",              /* Тип графика - японские свечи */
                    "locale": "ru",            /* Интерфейс на русском языке */
                    "enable_publishing": false,
                    "hide_side_toolbar": false, /* Боковая панель с инструментами рисования */
                    "allow_symbol_change": false,
                    "container_id": "tradingview_gazp"
                });
            </script>
        </div>
    </div>

    <script>
        // Сообщаем Telegram, что веб-приложение загружено
        window.Telegram.WebApp.ready();
        
        // Автоматически растягиваем Mini App на максимум, чтобы график занимал весь экран
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
