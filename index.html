<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MOEX Stocks — TradingView chart preview</title>
<style>
  :root{
    --bg:#29292f; --panel:#3a3a43; --text:#f2f2f4; --muted:#a8a8b0;
    --green:#59c98a; --red:#df6069; --pink:#ff4b89; --line:#4b4b54;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
  body{min-height:100vh}
  .app{width:min(520px,100vw);min-height:100vh;margin:auto;background:var(--bg);padding:18px 16px 26px}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .back{font-size:34px;line-height:1;color:#fff}
  .company h1{font-size:24px;margin:0 0 2px;font-weight:750}
  .company div{font-size:15px;color:var(--muted)}
  .quote-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin:22px 0 16px}
  .price{font-size:38px;font-weight:500;letter-spacing:-1px}
  .change{font-size:18px;margin-top:5px}
  .up{color:var(--green)} .down{color:var(--red)}
  .multiples{min-width:105px;border-left:1px solid var(--line);padding-left:14px;display:grid;gap:8px}
  .multiple{display:flex;justify-content:space-between;gap:10px}
  .multiple span{font-size:12px;color:var(--muted)}
  .multiple b{font-size:15px}
  .chart-card{background:var(--panel);border-radius:18px;padding:10px 8px 8px;overflow:hidden}
  #chart{height:360px;width:100%}
  .tf-wrap{display:flex;justify-content:center;align-items:center;padding:8px 2px 2px;overflow:hidden}
  .tf-viewport{width:164px;overflow:hidden;flex:0 0 auto}
  .tf-list{display:flex;justify-content:center;align-items:center;gap:6px;width:100%;will-change:transform}
  .tf-list button,.tf-slot{border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:9px;flex:0 0 46px;font:inherit;font-size:13px;min-width:46px;height:34px;box-sizing:border-box}
  .tf-list button{cursor:pointer}
  .tf-list button.active{background:#54545e;color:#fff}
  .tf-wrap{cursor:grab;touch-action:pan-y}
  .tf-wrap.dragging{cursor:grabbing}
  @media (max-width:420px){
    .tf-viewport{width:156px}
    .tf-list button,.tf-slot{flex-basis:44px;min-width:44px;padding-left:8px;padding-right:8px}
  }
  .status{font-size:12px;color:var(--muted);padding:10px 3px 0;min-height:28px}
  .note{font-size:11px;line-height:1.4;color:#8f8f98;margin-top:12px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="back">‹</div>
    <div class="company"><h1>ЛУКОЙЛ</h1><div>MOEX → LKOH</div></div>
  </div>

  <div class="quote-row">
    <div>
      <div class="price">5 269,0 ₽</div>
      <div class="change down">−0,02% (−1 ₽)</div>
    </div>
    <div class="multiples">
      <div class="multiple"><span>P/E</span><b>8,6</b></div>
      <div class="multiple"><span>EV/EBITDA</span><b>4,2</b></div>
    </div>
  </div>

  <div class="chart-card">
    <div id="chart"></div>
    <div class="tf-wrap" id="tfWrap" aria-label="Таймфрейм">
      <div class="tf-viewport" id="tfViewport">
        <div class="tf-list" id="tfList"></div>
      </div>
    </div>
    <div class="status" id="status">Загрузка реальных свечей MOEX…</div>
  </div>

  <div class="note">
    Новый селектор таймфреймов: три фиксированных позиции,
    выбранный всегда строго по центру. На краях одна из соседних
    позиций остаётся пустой. Телефон — свайп, компьютер — колесо
    мыши или перетаскивание.
  </div>
</div>

<script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
const API='https://hello-tg-app.onrender.com';
let chart, series;
let currentTf = '1h';

const TIMEFRAMES = [
  {id:'1m',  label:'1м',   interval:1,      days:3},
  {id:'5m',  label:'5м',   interval:5,      days:5},
  {id:'15m', label:'15м',  interval:15,     days:10},
  {id:'30m', label:'30м',  interval:30,     days:20},
  {id:'1h',  label:'1ч',   interval:60,     days:30},
  {id:'4h',  label:'4ч',   interval:240,    days:60},
  {id:'6h',  label:'6ч',   interval:360,    days:90},
  {id:'12h', label:'12ч',  interval:720,    days:180},
  {id:'1d',  label:'1д',   interval:1440,   days:365},
  {id:'3d',  label:'3д',   interval:4320,   days:730},
  {id:'7d',  label:'7д',   interval:10080,  days:1825},
  {id:'14d', label:'14д',  interval:20160,  days:3650},
  {id:'1mo', label:'1мес', interval:43200,  days:3650},
  {id:'3mo', label:'3мес', interval:129600, days:3650},
  {id:'6mo', label:'6мес', interval:259200, days:3650},
  {id:'1y',  label:'1г',   interval:525600, days:3650},
];

function visibleTimeframes(){
  const i = TIMEFRAMES.findIndex(x => x.id === currentTf);
  return {
    prev: i > 0 ? TIMEFRAMES[i - 1] : null,
    current: TIMEFRAMES[i],
    next: i < TIMEFRAMES.length - 1 ? TIMEFRAMES[i + 1] : null
  };
}

function renderTimeframeStrip(){
  const list = document.getElementById('tfList');
  list.innerHTML = '';

  const {prev, current, next} = visibleTimeframes();

  [prev, current, next].forEach((tf, idx) => {
    if(!tf){
      const slot = document.createElement('div');
      slot.className = 'tf-slot';
      slot.setAttribute('aria-hidden', 'true');
      list.appendChild(slot);
      return;
    }

    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = tf.label;
    b.className = idx === 1 ? 'active' : '';
    b.dataset.tf = tf.id;
    b.addEventListener('click', () => {
      currentTf = tf.id;
      renderTimeframeStrip();
      loadTimeframe(tf);
    });
    list.appendChild(b);
  });
}

function shiftTimeframe(delta){
  const i = TIMEFRAMES.findIndex(x => x.id === currentTf);
  const nextIndex = Math.max(0, Math.min(TIMEFRAMES.length - 1, i + delta));
  if(nextIndex === i) return;
  currentTf = TIMEFRAMES[nextIndex].id;
  renderTimeframeStrip();
  loadTimeframe(TIMEFRAMES[nextIndex]);
}

function bindSwipeSelector(){
  const el = document.getElementById('tfWrap');

  // Touch swipe.
  let sx = 0, sy = 0, touchActive = false;
  el.addEventListener('touchstart', e => {
    if(!e.touches.length) return;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    touchActive = true;
  }, {passive:true});

  el.addEventListener('touchend', e => {
    if(!touchActive || !e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    touchActive = false;
    if(Math.abs(dx) < 28 || Math.abs(dx) < Math.abs(dy)) return;
    shiftTimeframe(dx > 0 ? -1 : 1);
  }, {passive:true});

  // Desktop mouse wheel.
  let wheelLock = false;
  el.addEventListener('wheel', e => {
    e.preventDefault();
    if(wheelLock) return;
    wheelLock = true;
    shiftTimeframe(e.deltaY > 0 || e.deltaX > 0 ? 1 : -1);
    setTimeout(() => wheelLock = false, 140);
  }, {passive:false});

  // Desktop mouse drag.
  let down = false, startX = 0, moved = false;
  el.addEventListener('mousedown', e => {
    if(e.button !== 0) return;
    down = true;
    moved = false;
    startX = e.clientX;
    el.classList.add('dragging');
    e.preventDefault();
  });

  window.addEventListener('mousemove', e => {
    if(!down) return;
    const dx = e.clientX - startX;
    if(Math.abs(dx) < 28) return;
    moved = true;
    shiftTimeframe(dx > 0 ? -1 : 1);
    startX = e.clientX;
  });

  window.addEventListener('mouseup', () => {
    down = false;
    el.classList.remove('dragging');
  });
}

function makeChart(){
  chart=LightweightCharts.createChart(document.getElementById('chart'),{
    layout:{background:{type:'solid',color:'#3a3a43'},textColor:'#b7b7bf',fontFamily:'-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif'},
    grid:{vertLines:{color:'rgba(255,255,255,.03)'},horzLines:{color:'rgba(255,255,255,.05)'}},
    rightPriceScale:{borderColor:'#4b4b54',scaleMargins:{top:.08,bottom:.10}},
    timeScale:{borderColor:'#4b4b54',timeVisible:true,secondsVisible:false},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    handleScale:{mouseWheel:true,pinch:true,axisPressedMouseMove:true},
    handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:false}
  });
  series=chart.addSeries(LightweightCharts.CandlestickSeries,{
    upColor:'#59c98a',downColor:'#df6069',
    borderUpColor:'#59c98a',borderDownColor:'#df6069',
    wickUpColor:'#59c98a',wickDownColor:'#df6069'
  });
  new ResizeObserver(()=>chart.applyOptions({width:document.getElementById('chart').clientWidth}))
    .observe(document.getElementById('chart'));
}

function fallbackData(hours=120){
  const base=5269;
  const now=Math.floor(Date.now()/3600000)*3600;
  const fallback=[];
  for(let i=0;i<hours;i++){
    const t=now-(hours-i)*3600;
    const prev=i===0?base: fallback[i-1].close;
    const drift=Math.sin(i/7)*16+(Math.sin(i/17)*10);
    const close=prev+drift/8;
    const open=prev;
    const high=Math.max(open,close)+4+Math.abs(Math.sin(i))*5;
    const low=Math.min(open,close)-4-Math.abs(Math.cos(i))*4;
    fallback.push({time:t,open,high,low,close});
  }
  return fallback;
}

async function loadTimeframe(tf){
  document.getElementById('status').textContent='Загрузка свечей '+tf.label+'…';
  try{
    const r=await fetch(
      API+'/api/candles?symbol=LKOH&interval='+tf.interval+'&days='+tf.days,
      {cache:'no-store'}
    );
    if(!r.ok) throw new Error('HTTP '+r.status);

    const j=await r.json();
    const data=(j.candles||[]).map(c=>({
      time:Math.floor(new Date(c.begin).getTime()/1000),
      open:Number(c.open),high:Number(c.high),
      low:Number(c.low),close:Number(c.close)
    })).filter(c=>c.time && [c.open,c.high,c.low,c.close].every(Number.isFinite));

    if(!data.length) throw new Error('empty');

    series.setData(data);
    chart.timeScale().fitContent();
    document.getElementById('status').textContent=
      'Реальные данные MOEX • '+data.length+' свечей • '+tf.label;
  }catch(e){
    document.getElementById('status').textContent=
      'Не удалось загрузить '+tf.label+' • Render backend пока не обновлён';
    console.warn('Candles unavailable:',e);
  }
}

makeChart();
renderTimeframeStrip();
bindSwipeSelector();
loadTimeframe(TIMEFRAMES.find(x => x.id === currentTf));

</script>
</body>
</html>
