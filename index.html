<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOEX Local Charts</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #131722; /* Тёмная тема биржи */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Шапка-скролл для выбора компаний */
        .tabs-scroll-container {
            display: flex;
            gap: 8px;
            background-color: #1c2030;
            padding: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 10;
            overflow-x: auto;
        }

        .tabs-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .tab-button {
            background-color: #2a2e39;
            color: #b2b5be;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .tab-button.active {
            background-color: #2962ff;
            color: #ffffff;
            box-shadow: 0 0 8px rgba(41, 98, 255, 0.5);
        }

        /* Инфо-блок выбранной акции */
        .stock-info {
            padding: 15px 20px;
            background-color: #1c2030;
            border-bottom: 1px solid #2a2e39;
        }

        .stock-title {
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stock-price {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
            color: #0ecb81;
        }

        /* Зона графика (70% экрана) */
        .chart-section {
            height: 60vh;
            width: 100%;
            position: relative;
            padding: 10px 0;
            box-sizing: border-box;
            background-color: #131722;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .footer-info {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1c2030;
            padding: 10px;
            border-top: 1px solid #2a2e39;
            font-size: 13px;
            color: #848e9c;
        }
    </style>
</head>
<body>

    <!-- Меню выбора со скроллом -->
    <div class="tabs-scroll-container">
        <button class="tab-button active" onclick="selectStock('gazp', this)">Газпром</button>
        <button class="tab-button" onclick="selectStock('sber', this)">Сбербанк</button>
        <button class="tab-button" onclick="selectStock('rosn', this)">Роснефть</button>
    </div>

    <!-- Инфо-панель -->
    <div class="stock-info">
        <div id="stock-name" class="stock-title">ПАО «Газпром»</div>
        <div id="stock-price" class="stock-price">128.45 ₽</div>
    </div>

    <!-- Наш собственный независимый график -->
    <div class="chart-section">
        <canvas id="localChart"></canvas>
    </div>

    <div class="footer-info">
        <p>📊 Визуальный график построен локально и защищен от блокировок Telegram</p>
    </div>

    <script type="text/javascript">
        // Точки графиков (имитируем реальные свечи/тренды Мосбиржи)
        const chartData = {
            gazp: { name: "ПАО «Газпром»", price: "128.45 ₽", color: "#2962ff", points: [135, 132, 130, 126, 129, 125, 127, 124, 126, 128.45] },
            sber: { name: "Сбербанк России", price: "245.20 ₽", color: "#0ecb81", points: [230, 232, 235, 239, 237, 241, 240, 243, 242, 245.20] },
            rosn: { name: "ПАО «Роснефть»", price: "482.10 ₽", color: "#ff9800", points: [460, 465, 462, 470, 475, 471, 478, 485, 480, 482.10] }
        };

        let currentId = 'gazp';

        function drawChart() {
            const canvas = document.getElementById('localChart');
            const ctx = canvas.getContext('2d');
            
            // Адаптируем разрешение холста под размер экрана мобильного
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            const width = rect.width;
            const height = rect.height;
            const data = chartData[currentId];
            const points = data.points;

            // Очищаем холст перед перерисовкой
            ctx.clearRect(0, 0, width, height);

            // Рисуем фоновую сетку трейдера
            ctx.strokeStyle = '#2a2e39';
            ctx.lineWidth = 0.5;
            for (let i = 1; i < 5; i++) {
                let y = (height / 5) * i;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            // Вычисляем координаты для линии тренда
            const minVal = Math.min(...points) * 0.98;
            const maxVal = Math.max(...points) * 1.02;
            const stepX = width / (points.length - 1);

            function getX(index) { return index * stepX; }
            function getY(val) { return height - ((val - minVal) / (maxVal - minVal)) * height; }

            // 1. Рисуем красивый градиент-заливку под графиком
            let gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, data.color + '40'); // Полупрозрачный цвет
            gradient.addColorStop(1, data.color + '00'); // Уходит в ноль

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(getX(0), height);
            for (let i = 0; i < points.length; i++) {
                ctx.lineTo(getX(i), getY(points[i]));
            }
            ctx.lineTo(getX(points.length - 1), height);
            ctx.closePath();
            ctx.fill();

            // 2. Рисуем саму линию графика
            ctx.strokeStyle = data.color;
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(getX(0), getY(points[0]));
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(getX(i), getY(points[i]));
            }
            ctx.stroke();

            // 3. Рисуем финальную мигающую точку на конце графика
            const lastIdx = points.length - 1;
            ctx.fillStyle = data.color;
            ctx.beginPath();
            ctx.arc(getX(lastIdx) - 5, getY(points[lastIdx]), 6, 0, 2 * Math.PI);
            ctx.fill();
        }

        // Переключение вкладок компаний
        function selectStock(id, buttonElement) {
            currentId = id;
            
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            // Обновляем текстовые данные
            document.getElementById('stock-name').innerText = chartData[id].name;
            document.getElementById('stock-price').innerText = chartData[id].price;
            
            // Подсвечиваем цену цветом компании
            document.getElementById('stock-price').style.color = chartData[id].color;

            // Перерисовываем график под новые данные
            drawChart();
        }

        window.onload = () => {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            drawChart(); // Отрисовка первого графика при старте
        };

        // Перерисовываем график, если пользователь перевернул экран смартфона
        window.onresize = drawChart;
    </script>
</body>
</html>
