<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Cat Mini App</title>
    <!-- ИСПРАВЛЕНО: Полная и правильная ссылка на скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fbfbfb;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        #cat {
            position: absolute;
            top: 45vh;
            left: 0px;
            width: 100px;
            height: auto;
            transition: transform 0.1s linear;
        }
    </style>
</head>
<body>

    <!-- ИСПРАВЛЕНО: Прямая и рабочая ссылка на GIF-анимацию бегущего котика -->
    <img id="cat" src="https://postimg.cc" alt="Running Cat">

    <script>
        window.Telegram.WebApp.ready();

        const cat = document.getElementById('cat');
        let posX = 0;
        let speed = 4;       // Скорость бега (можно увеличить)
        let direction = 1;

        function animateCat() {
            const screenWidth = window.innerWidth;
            const catWidth = cat.offsetWidth;

            posX += speed * direction;

            if (posX + catWidth >= screenWidth && direction === 1) {
                direction = -1;
                cat.style.transform = 'scaleX(-1)'; 
            }
            else if (posX <= 0 && direction === -1) {
                direction = 1;
                cat.style.transform = 'scaleX(1)';
            }

            cat.style.left = posX + 'px';
            requestAnimationFrame(animateCat);
        }

        window.onload = () => {
            animateCat();
        };
    </script>
</body>
</html>
